[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[project]
name = "industrial-platform-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "pydantic-settings>=2.4",
  "jsonschema>=4.23",
  "referencing>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "httpx>=0.27", "pyyaml>=6"]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: needs a real PostgreSQL (IP_TEST_DATABASE_URL)"]
